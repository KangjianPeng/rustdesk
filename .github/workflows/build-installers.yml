name: Build installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dioxus-ui
  push:
    branches:
      - dioxus-ui
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-deb:
    name: Linux x86_64 (.deb)
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            dpkg-dev \
            git \
            libaom-dev \
            libasound2-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libcap-dev \
            libclang-dev \
            libdav1d-dev \
            libdrm-dev \
            libegl-dev \
            libgles2-mesa-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libopus-dev \
            libpulse-dev \
            libseccomp-dev \
            libssl-dev \
            libunwind-dev \
            libva-dev \
            libvdpau-dev \
            libvpx-dev \
            libwebkit2gtk-4.1-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            libyuv-dev \
            meson \
            ninja-build \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build Debian package
        run: python3 build.py --no-default-features --hwcodec

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustdesk-linux-x86_64-deb
          path: rustdesk-*.deb
          if-no-files-found: error
          retention-days: 14

  windows-installer:
    name: Windows x86_64 (.exe)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: 'C:\vcpkg'
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: 15.0.6

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: 'C:\vcpkg'
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          vcpkgJsonGlob: "**/.github/vcpkg-build/vcpkg.json"
          runVcpkgInstall: false
          doNotCache: false

      - name: Install native codec dependencies
        shell: pwsh
        run: >-
          & "$env:VCPKG_ROOT\vcpkg.exe" install
          --triplet x64-windows-static
          "--x-manifest-root=$env:GITHUB_WORKSPACE/.github/vcpkg-build"
          "--x-install-root=$env:VCPKG_ROOT/installed"

      - name: Install portable packer Python dependencies
        shell: bash
        run: python3 -m pip install -r libs/portable/requirements.txt

      - name: Build Windows installer
        shell: bash
        run: bash .github/scripts/log-installer-build.sh python3 build.py --no-default-features --hwcodec

      - name: Upload Windows installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustdesk-windows-x86_64-exe
          path: rustdesk-*-install.exe
          if-no-files-found: error
          retention-days: 14

  macos-dmg:
    name: macOS arm64 (.dmg)
    runs-on: macos-26
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install native build dependencies
        run: |
          brew install create-dmg llvm nasm pkg-config
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set vcpkg root
        run: echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          vcpkgJsonGlob: "**/.github/vcpkg-build/vcpkg.json"
          runVcpkgInstall: false
          doNotCache: false

      - name: Install native codec dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-osx \
            --x-manifest-root="$GITHUB_WORKSPACE/.github/vcpkg-build" \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build macOS disk image
        run: bash .github/scripts/log-installer-build.sh python3 build.py --no-default-features --hwcodec

      - name: Upload macOS disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustdesk-macos-arm64-dmg
          path: "*.dmg"
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Android arm64 (.apk)
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            git \
            libclang-dev \
            libssl-dev \
            nasm \
            ninja-build \
            pkg-config \
            unzip \
            zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Export GitHub Actions cache environment
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set vcpkg root
        run: echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          vcpkgJsonGlob: "**/.github/vcpkg-build/vcpkg.json"
          runVcpkgInstall: false
          doNotCache: false

      - name: Install Android native codec dependencies
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-android \
            --x-manifest-root="$GITHUB_WORKSPACE/.github/vcpkg-build" \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: android-aarch64-linux-android

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.10 --locked

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          # Dioxus supplies Android OpenSSL paths globally. Keep host build scripts
          # on the runner's native OpenSSL installation instead.
          X86_64_UNKNOWN_LINUX_GNU_OPENSSL_LIB_DIR: /usr/lib/x86_64-linux-gnu
          X86_64_UNKNOWN_LINUX_GNU_OPENSSL_INCLUDE_DIR: /usr/include
          X86_64_UNKNOWN_LINUX_GNU_OPENSSL_NO_VENDOR: "0"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: >-
            ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang
        run: >-
          bash .github/scripts/log-installer-build.sh
          dx bundle --release --platform android --package-types apk
          --bin rustdesk --target aarch64-linux-android --no-default-features
          --features "use_dasp dioxus-ui mediacodec" --locked --out-dir dist/android

      - name: Sign and verify APK for sideloading
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find dist/android -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apksigner="$build_tools/apksigner"
          if ! "$apksigner" verify "$apk"; then
            keytool -genkeypair -keystore ci-debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=RustDesk,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
            "$apksigner" sign --ks ci-debug.keystore --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias androiddebugkey "$apk"
          fi
          "$apksigner" verify --verbose "$apk"
          if [ "$apk" != "dist/android/RustDesk-android-arm64.apk" ]; then
            mv "$apk" dist/android/RustDesk-android-arm64.apk
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustdesk-android-arm64-apk
          path: dist/android/RustDesk-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
